#version: "3.8"

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"

    APP_DB_HOST: postgres
    APP_DB_PORT: 5432
    APP_DB_NAME: ${POSTGRES_DB}
    APP_DB_USER: ${POSTGRES_USER}
    APP_DB_PASSWORD: ${POSTGRES_PASSWORD}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/dags/src
    - ./data:/opt/airflow/data
    - ./include:/opt/airflow/include
    - ./reports:/opt/airflow/reports
    - airflow_logs:/opt/airflow/logs
  depends_on:
    - postgres-airflow

services:

  postgres:
    image: postgres:15
    container_name: datastore360_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./include/sql:/docker-entrypoint-initdb.d

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: datastore360_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  postgres-airflow:
    image: postgres:15
    container_name: datastore360_postgres_airflow
    restart: always
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - pgdata_airflow:/var/lib/postgresql/data

  airflow-init:
    <<: *airflow-common
    container_name: datastore360_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true


  airflow-webserver:
    <<: *airflow-common
    container_name: datastore360_airflow_webserver
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      - airflow-init

  airflow-scheduler:
    <<: *airflow-common
    container_name: datastore360_airflow_scheduler
    command: scheduler
    depends_on:
      - airflow-init

volumes:
  pgdata:
  pgdata_airflow:
  airflow_logs:
